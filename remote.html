<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyTV Télécommande</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0b0d17; --fg:#f2f4ff; --card:#1a1e33; --card2:#262b47; --mut:#a4a9c4; --acc:#7c5cff; --on:#ffffff; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:16px/1.2 'Space Grotesk', system-ui, sans-serif; transition:background .4s; overscroll-behavior:none; touch-action:manipulation; }
#app { max-width:480px; height:100vh; height:100dvh; margin:0 auto; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); overflow:hidden; }
header { flex:none; display:flex; align-items:center; justify-content:space-between; padding:12px 18px 4px; }
header h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.01em; }
#chip { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mut); background:var(--card); padding:6px 12px; border-radius:20px; }
#chip i { width:9px; height:9px; border-radius:50%; background:#777; }
#chip.on i { background:#3ddc84; box-shadow:0 0 8px #3ddc84; } #chip.on { color:var(--fg); }
main { flex:1; min-height:0; overflow:hidden; padding:8px 18px 4px; }
.page { display:none; height:100%; } .page.show { display:flex; flex-direction:column; gap:12px; }
button { border:0; font:inherit; color:inherit; background:var(--card); border-radius:18px; transition:transform .1s, filter .1s, background .15s; touch-action:manipulation; padding:0; }
button:active, .down { transform:scale(.94); filter:brightness(1.3); }
.apps { flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.app { height:clamp(74px, 11.5dvh, 92px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:11px; font-weight:600; border-radius:16px; min-width:0; }
.apps.six { grid-template-columns:repeat(6,1fr); gap:6px; margin-top:-4px; } .apps.six .app { font-size:10px; height:clamp(66px, 10.5dvh, 84px); } .apps.six .app b { width:38px; height:38px; }
.app b { width:44px; height:44px; border-radius:24%; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; overflow:hidden; }
.app b svg { display:block; }
.app span { max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.app.sent { background:var(--acc); color:var(--on); }
.padwrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
.dpad { position:relative; width:min(270px, 100%, 36dvh); aspect-ratio:1; border-radius:50%; background:var(--card); }
.dpad button { position:absolute; width:33%; height:33%; background:transparent; border-radius:50%; font-size:24px; color:var(--mut); display:flex; align-items:center; justify-content:center; }
.dpad .u { left:33.5%; top:2%; } .dpad .d { left:33.5%; bottom:2%; } .dpad .l { left:2%; top:33.5%; } .dpad .r { right:2%; top:33.5%; }
.dpad .ok { left:29%; top:29%; width:42%; height:42%; background:var(--acc); color:var(--on); font-weight:700; font-size:20px; }
.row5 { flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.row5 button { height:52px; font-weight:500; font-size:14px; border-radius:16px; }
input { width:100%; height:48px; border-radius:24px; border:2px solid transparent; background:var(--card); color:var(--fg); padding:0 20px; font:inherit; font-size:16px; -webkit-user-select:text; user-select:text; outline:none; }
input:focus { border-color:var(--acc); }
.count { flex:none; font-size:13px; color:var(--mut); margin:-4px 4px 0; }
#chs { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:8px; }
.ch { flex:none; height:54px; padding:0 12px; display:flex; align-items:center; gap:12px; text-align:left; border-radius:16px; }
.ch u { flex:none; width:36px; height:36px; border-radius:11px; background:var(--card2); color:var(--mut); display:flex; align-items:center; justify-content:center; font-size:11px; text-decoration:none; }
.ch span { min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
.card { background:var(--card); border-radius:22px; padding:14px; }
.card h3 { margin:0 0 10px; font-size:13px; font-weight:400; color:var(--mut); }
.themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.theme { height:76px; background:var(--card2); border:2px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:12px; font-weight:500; border-radius:16px; }
.theme.sel { border-color:var(--acc); }
.tp { position:relative; width:46px; height:28px; border-radius:8px; border:2px solid; }
.tp b { position:absolute; left:5px; top:5px; width:20px; height:6px; border-radius:3px; } .tp u { position:absolute; right:5px; bottom:4px; width:10px; height:10px; border-radius:50%; }
.seg { display:flex; gap:4px; background:var(--card2); border-radius:20px; padding:4px; }
.seg + .seg { margin-top:8px; }
.seg button { flex:1; height:40px; background:transparent; border-radius:16px; font-size:14px; color:var(--mut); }
.seg button.sel { background:var(--acc); color:var(--on); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.two button { height:50px; background:var(--card2); font-weight:500; font-size:14px; }
.count2 { font-size:12px; color:var(--mut); margin-top:10px; text-align:center; }
nav { flex:none; padding:6px 14px calc(10px + env(safe-area-inset-bottom)); }
nav div { display:flex; gap:6px; padding:5px; border-radius:30px; background:var(--card); }
nav button { flex:1; height:46px; border-radius:24px; background:transparent; color:var(--mut); font-weight:500; }
nav button.sel { background:var(--acc); color:var(--on); }
#setup { display:none; margin:40px 20px; background:var(--card); border-radius:24px; padding:22px; line-height:1.4; }
#toast { position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:#000d; color:#fff; padding:10px 18px; border-radius:16px; font-size:15px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis; }
@media (max-height:700px) { .dpad { width:min(220px, 100%, 34dvh); } .app { height:70px; } }
</style>
</head>
<body>
<div id="app">
  <header><h1>MyTV</h1><div id="chip"><i></i><span>En attente…</span></div></header>
  <div id="setup">Aucune TV liée. Sur la TV, ouvre <b>Réglages → Télécommande téléphone</b> puis scanne le QR code avec ton téléphone.</div>
  <main id="main">
    <section class="page show" id="p-pad">
      <div class="apps" id="apps"></div><div class="apps six" id="apps2"></div>
      <div class="padwrap">
        <div class="dpad">
          <button class="u" data-k="up" data-rep aria-label="Haut">▲</button><button class="l" data-k="left" data-rep aria-label="Gauche">◀</button>
          <button class="ok" data-k="ok">OK</button>
          <button class="r" data-k="right" data-rep aria-label="Droite">▶</button><button class="d" data-k="down" data-rep aria-label="Bas">▼</button>
        </div>
      </div>
      <div class="row5">
        <button data-k="back" aria-label="Retour">⮌</button><button data-c="home" aria-label="Accueil">⌂</button><button data-c="stop" aria-label="Stop">■</button>
        <button data-c="ch:prev" data-rep2>CH −</button><button data-c="ch:next" data-rep2>CH +</button>
      </div>
    </section>
    <section class="page" id="p-tv">
      <input id="q" placeholder="Rechercher une chaîne…" autocomplete="off" enterkeyhint="search">
      <div class="count" id="count"></div>
      <div id="chs"></div>
    </section>
    <section class="page" id="p-set">
      <div class="card"><h3>Thème</h3><div class="themes" id="themes"></div></div>
      <div class="card"><h3>Halo lumineux</h3><div class="seg" id="glows"></div><div class="seg" id="intens"></div></div>
      <div class="card"><h3>Application</h3>
        <div class="two"><button data-c="reload">Mettre à jour la TV</button><button id="unlink">Changer de TV</button></div>
        <div class="count2" id="ver"></div></div>
    </section>
  </main>
  <nav><div id="tabs"><button class="sel" data-p="p-pad">Manette</button><button data-p="p-tv">Chaînes</button><button data-p="p-set">Réglages</button></div></nav>
</div>
<div id="toast"></div>

  var TXT = { 'Disney+': ['Disney+', 5.6, 'italic 700'], 'Canal+': ['CANAL+', 4.6, '800'], 'TF1+': ['TF1+', 7.6, '800'] };
  function icon(a) {
    var fg = a[0] === 'Netflix' ? '#e50914' : '#fff', bg = a[0] === 'Netflix' ? '#000' : a[2], i;
    if (a[3] && PATHS[a[3]]) i = '<g transform="translate(4.8 4.8) scale(.6)" fill="' + fg + '"><path d="' + PATHS[a[3]] + '"/></g>';
    else { var t = TXT[a[0]]; i = '<text x="12" y="12" dy=".35em" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="' + t[2].split(' ').pop() + '"' + (t[2].indexOf('italic') === 0 ? ' font-style="italic"' : '') + ' font-size="' + t[1] + '" fill="#fff">' + t[0] + '</text>'; }
    return '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect width="24" height="24" fill="' + bg + '"/>' + i + '</svg>';
  }
  // [nom envoyé à la TV, libellé court, couleur, logo, rangée]
  var APPS = [['YouTube','YouTube','#e62117','youtube',1],['Disney+','Disney+','#113ccf','',1],['Netflix','Netflix','#e50914','netflix',1],['Prime Video','Prime','#00a8e1','primevideo',1],['Jellyfin','Jellyfin','#8f5fc9','jellyfin',1],
              ['Apple TV','Apple TV','#3a3a3c','appletv',2],['Canal+','Canal+','#2b2b2b','',2],['Hue Sync','Hue Sync','#7a3cff','philipshue',2],['Spotify','Spotify','#1db954','spotify',2],['TF1+','TF1+','#1a56db','',2],['Twitch','Twitch','#9146ff','twitch',2]];

  var TH = { aurora:['#0b0d17','#1a1e33','#262b47','#7c5cff','#f2f4ff','#a4a9c4','#fff'], sunset:['#1a0d12','#2e1a22','#3d242d','#ff6a3d','#fff3ef','#c9a9b0','#1a0d12'],
             forest:['#09140f','#14281d','#1d3a29','#3ddc84','#effaf3','#9fc0ae','#09140f'], mono:['#0d0d0d','#202020','#2e2e2e','#ffffff','#f5f5f5','#a6a6a6','#0d0d0d'] };
  var GLOWS = [['video','Vidéo'],['pulse','Pulse'],['rainbow','Arc-en-ciel'],['off','Éteint']];
  var INTENS = [['0','Faible'],['1','Moyen'],['2','Fort']];
  var $ = function (s) { return document.querySelector(s); };
  var ST = function (k, v) { try { if (v === undefined) return localStorage.getItem('mytv.' + k); if (v === null) localStorage.removeItem('mytv.' + k); else localStorage.setItem('mytv.' + k, v); } catch (e) {} };
  var topic = '', m = /^mytv-[a-z0-9]{8,}$/.exec(location.hash.slice(1));
  if (m) { ST('topic', m[0]); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  topic = ST('topic') || '';

  function skin(name) {
    var c = TH[name]; if (!c) return; var r = document.documentElement.style;
    ['--bg','--card','--card2','--acc','--fg','--mut','--on'].forEach(function (k, i) { r.setProperty(k, c[i]); });
    document.querySelector('meta[name=theme-color]').content = c[0]; ST('theme', name);
  }
  skin(ST('theme') || 'aurora');

  var tt;
  function toast(t) { var o = $('#toast'); o.textContent = t; o.style.opacity = 1; clearTimeout(tt); tt = setTimeout(function () { o.style.opacity = 0; }, 1400); }
  function buzz(n) { if (navigator.vibrate) navigator.vibrate(n || 12); }
  function post(msg) { return fetch(BASE + topic, { method: 'POST', body: msg }); }
  function send(msg, label) {
    buzz();
    post(msg).then(function (r) { if (!r.ok) throw 0; if (label) toast(label); }).catch(function () { toast('Pas de connexion'); });
  }

  if (!topic) { $('#setup').style.display = 'block'; $('#main').style.display = 'none'; $('nav').style.display = 'none'; $('#chip').style.display = 'none'; return; }

  /* ---- état de la TV (reçu via le même relais) ---- */
  var tv = { at: 0, theme: '', glow: '', inten: '' }, seen = '';
  function paint() {
    var on = Date.now() - tv.at < 75000;
    $('#chip').className = on ? 'on' : ''; $('#chip span').textContent = on ? 'TV connectée' : (tv.at ? 'TV hors ligne' : 'En attente de la TV…');
    [].forEach.call(document.querySelectorAll('.theme'), function (b) { b.classList.toggle('sel', b.dataset.t === tv.theme); });
    [].forEach.call(document.querySelectorAll('#glows button'), function (b) { b.classList.toggle('sel', b.dataset.v === tv.glow); });
    [].forEach.call(document.querySelectorAll('#intens button'), function (b) { b.classList.toggle('sel', b.dataset.v === String(tv.inten)); });
  }
  function listen() {
    var es = new EventSource(BASE + topic + '/sse');
    es.onopen = function () { send('ping'); };
    es.onmessage = function (ev) {
      try {
        var j = JSON.parse(ev.data), t = String(j.message || '');
        if (j.event && j.event !== 'message') return; if (j.id === seen) return; seen = j.id;
        if (t.indexOf('state:') !== 0) return;
        var s = JSON.parse(t.slice(6)); tv.at = Date.now(); tv.theme = s.theme; tv.glow = s.glow; tv.inten = s.inten;
        if (s.theme) skin(s.theme); if (s.v) $('#ver').textContent = 'Version TV ' + s.v; paint();
      } catch (e) {}
    };
  }
  setInterval(paint, 5000); listen();

  /* ---- onglets ---- */
  [].forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.onclick = function () {
      buzz(8);
      [].forEach.call(document.querySelectorAll('#tabs button'), function (x) { x.classList.toggle('sel', x === b); });
      [].forEach.call(document.querySelectorAll('.page'), function (p) { p.classList.toggle('show', p.id === b.dataset.p); });
      if (b.dataset.p === 'p-tv') { loadChannels(); render(); }
    };
  });

  /* ---- manette ---- */
  APPS.forEach(function (a) {
    var b = document.createElement('button'); b.className = 'app';
    b.innerHTML = '<b>' + icon(a) + '</b><span></span>'; b.lastChild.textContent = a[1];
    b.onclick = function () { b.classList.add('sent'); setTimeout(function () { b.classList.remove('sent'); }, 600); send('app:' + a[0], 'Ouverture de ' + a[0] + '…'); };
    $(a[4] === 1 ? '#apps' : '#apps2').appendChild(b);
  });
  // appui + maintien = répétition (flèches, CH+/CH-)
  function holdable(b, msg) {
    var iv, to;
    function fire() { buzz(8); post(msg).catch(function () { toast('Pas de connexion'); }); }
    function stop() { clearTimeout(to); clearInterval(iv); b.classList.remove('down'); }
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); b.classList.add('down'); fire();
      if (b.hasAttribute('data-rep') || b.hasAttribute('data-rep2')) to = setTimeout(function () { iv = setInterval(fire, 260); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, stop); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  [].forEach.call(document.querySelectorAll('[data-k]'), function (b) { holdable(b, 'key:' + b.dataset.k); });
  [].forEach.call(document.querySelectorAll('[data-c]'), function (b) {
    if (b.hasAttribute('data-rep2')) holdable(b, b.dataset.c);
    else b.onclick = function () { send(b.dataset.c, b.dataset.c === 'reload' ? 'Mise à jour demandée' : ''); };
  });

  /* ---- réglages ---- */
  Object.keys(TH).forEach(function (t) {
    var c = TH[t], b = document.createElement('button'); b.className = 'theme'; b.dataset.t = t;
    b.innerHTML = '<div class="tp" style="background:' + c[0] + ';border-color:' + c[2] + '"><b style="background:' + c[1] + '"></b><u style="background:' + c[3] + '"></u></div><span></span>';
    b.lastChild.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    b.onclick = function () { tv.theme = t; skin(t); paint(); send('theme:' + t); };
    $('#themes').appendChild(b);
  });
  GLOWS.forEach(function (g) { var b = document.createElement('button'); b.textContent = g[1]; b.dataset.v = g[0]; b.onclick = function () { tv.glow = g[0]; paint(); send('glow:' + g[0]); }; $('#glows').appendChild(b); });
  INTENS.forEach(function (g) { var b = document.createElement('button'); b.textContent = g[1]; b.dataset.v = g[0]; b.onclick = function () { tv.inten = g[0]; paint(); send('inten:' + g[0]); }; $('#intens').appendChild(b); });
  $('#unlink').onclick = function () { if (confirm('Délier ce téléphone de la TV ?')) { ST('topic', null); location.reload(); } };

  /* ---- chaînes : la liste tient dans l'écran (pas de défilement), on affine avec la recherche ---- */
  var channels = null, loading = false;
  function parse(txt) {
    var out = [], name = null;
    txt.split(/\r?\n/).forEach(function (l) {
      if (l.indexOf('#EXTINF') === 0) name = l.split(',').slice(1).join(',').trim();
      else if (name && l && l[0] !== '#') { out.push(name); name = null; }
    });
    return out;
  }
  function rank(n) { var l = n.toLowerCase(), i; for (i = 0; i < PRIO.length; i++) if (l.indexOf(PRIO[i]) === 0 || l.indexOf(PRIO[i]) >= 0 && i < 4) return i; return 999; }
  function render() {
    var q = $('#q').value.toLowerCase(), box = $('#chs'); box.innerHTML = '';
    if (!channels) return;
    var list = channels.filter(function (n) { return n.toLowerCase().indexOf(q) >= 0; });
    if (!q) list = list.map(function (n, i) { return [rank(n), i, n]; }).sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; }).map(function (x) { return x[2]; });
    var fit = Math.max(3, Math.floor((box.clientHeight + 8) / 62));
    $('#count').textContent = list.length ? (list.length > fit ? fit + ' sur ' + list.length + ' · affine avec la recherche' : list.length + ' chaîne' + (list.length > 1 ? 's' : '')) : 'Aucune chaîne';
    list.slice(0, fit).forEach(function (n) {

  }
