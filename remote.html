<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MyTV Télécommande</title>
<style>
:root { --bg:#0b0f1a; --card:#161c2e; --fg:#f2f5ff; --mut:#8c97b5; --acc:#6ee7ff; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.3 system-ui,sans-serif; padding:16px 16px 40px; max-width:520px; margin:0 auto; }
h1 { font-size:20px; margin:4px 0 2px; } h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:22px 0 8px; }
#st { font-size:13px; color:var(--mut); }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
button { border:0; border-radius:14px; background:var(--card); color:var(--fg); font:inherit; padding:14px 8px; }
button:active { transform:scale(.96); filter:brightness(1.3); }
.app { height:84px; font-weight:600; color:#fff; }
.pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:300px; margin:0 auto; }
.pad button { height:68px; font-size:24px; } .pad .ok { background:var(--acc); color:#04121a; font-weight:700; font-size:18px; }
.row { display:flex; gap:10px; flex-wrap:wrap; } .row button { flex:1; min-width:80px; }
input { width:100%; padding:12px; border-radius:12px; border:1px solid #2a3350; background:var(--card); color:var(--fg); font:inherit; }
#chs { margin-top:8px; display:flex; flex-direction:column; gap:6px; } #chs button { text-align:left; padding:12px; }
#setup { display:none; background:var(--card); border-radius:14px; padding:14px; margin-top:14px; }
#toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>
<body>
<h1>MyTV Télécommande</h1>
<div id="st"></div>
<div id="setup">Aucune TV liée. Sur la TV, ouvre <b>Réglages → Télécommande téléphone</b> puis scanne le QR code avec ton téléphone.</div>

<div id="main">
<h2>Applications</h2>
<div class="grid" id="apps"></div>

<h2>Navigation</h2>
<div class="pad">
  <span></span><button data-k="up">▲</button><span></span>
  <button data-k="left">◀</button><button data-k="ok" class="ok">OK</button><button data-k="right">▶</button>
  <button data-c="home">⌂</button><button data-k="down">▼</button><button data-k="back">⮌</button>
</div>

<h2>Thème</h2>
<div class="row" id="themes"></div>

<h2>Halo lumineux</h2>
<div class="row" id="glows"></div>
<div class="row" style="margin-top:10px" id="intens"></div>

<h2>Chaînes TV</h2>
<input id="q" placeholder="Rechercher une chaîne…" autocomplete="off">
<div id="chs"></div>
<div class="row" style="margin-top:10px"><button data-c="stop">Arrêter la lecture</button></div>
</div>
<div id="toast"></div>

<script>
(function () {
  var BASE = 'https://ntfy.sh/', M3U = 'https://iptv-org.github.io/iptv/countries/fr.m3u';
  var APPS = [['YouTube','#e62117'],['Netflix','#e50914'],['Disney+','#113ccf'],['Prime Video','#00a8e1'],['Jellyfin','#8f5fc9']];
  var THEMES = ['aurora','sunset','forest','mono'];
  var GLOWS = [['video','Vidéo'],['pulse','Pulsation'],['rainbow','Arc-en-ciel'],['off','Éteint']];
  var $ = function (s) { return document.querySelector(s); };
  var topic = '';
  try {
    var h = location.hash.replace(/^#/, '');
    if (/^mytv-[a-z0-9]{8,}$/.test(h)) { localStorage.setItem('mytv.topic', h); history.replaceState(null, '', location.pathname); }
    topic = localStorage.getItem('mytv.topic') || '';
  } catch (e) { var m = /^mytv-[a-z0-9]{8,}$/.exec(location.hash.slice(1)); topic = m ? m[0] : ''; }

  var tt;
  function toast(t) { var o = $('#toast'); o.textContent = t; o.style.opacity = 1; clearTimeout(tt); tt = setTimeout(function () { o.style.opacity = 0; }, 1500); }
  function send(msg) {
    if (!topic) return;
    if (navigator.vibrate) navigator.vibrate(15);
    fetch(BASE + topic, { method: 'POST', body: msg }).then(function (r) { if (!r.ok) throw 0; toast('Envoyé'); })
      .catch(function () { toast('Échec : pas de connexion'); });
  }
  function btn(parent, label, msg, color) {
    var b = document.createElement('button'); b.textContent = label;
    if (color) { b.className = 'app'; b.style.background = color; }
    b.onclick = function () { send(msg); }; parent.appendChild(b); return b;
  }
  if (!topic) { $('#setup').style.display = 'block'; $('#main').style.display = 'none'; return; }
  $('#st').textContent = 'TV liée · ' + topic.slice(0, 9) + '…';

  APPS.forEach(function (a) { btn($('#apps'), a[0], 'app:' + a[0], a[1]); });
  [].forEach.call(document.querySelectorAll('[data-k]'), function (b) { b.onclick = function () { send('key:' + b.dataset.k); }; });
  [].forEach.call(document.querySelectorAll('[data-c]'), function (b) { b.onclick = function () { send(b.dataset.c); }; });
  THEMES.forEach(function (t) { btn($('#themes'), t, 'theme:' + t); });
  GLOWS.forEach(function (g) { btn($('#glows'), g[1], 'glow:' + g[0]); });
  [['Faible',0],['Moyen',1],['Fort',2]].forEach(function (i) { btn($('#intens'), i[0], 'inten:' + i[1]); });

  var channels = null;
  function parse(txt) {
    var out = [], name = null;
    txt.split(/\r?\n/).forEach(function (l) {
      if (l.indexOf('#EXTINF') === 0) name = l.split(',').slice(1).join(',').trim();
      else if (name && l && l[0] !== '#') { out.push(name); name = null; }
    });
    return out;
  }
  function render() {
    var q = $('#q').value.toLowerCase(), box = $('#chs'); box.innerHTML = '';
    if (!channels) return;
    channels.filter(function (n) { return n.toLowerCase().indexOf(q) >= 0; }).slice(0, 30).forEach(function (n) { btn(box, n, 'tv:' + n); });
  }
  $('#q').addEventListener('focus', function () {
    if (channels) return;
    fetch(M3U).then(function (r) { return r.text(); }).then(function (t) { channels = parse(t); render(); })
      .catch(function () { toast('Playlist inaccessible'); });
  });
  $('#q').addEventListener('input', render);
})();
</script>
</body>
</html>
