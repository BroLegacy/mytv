<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>MyTV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="aurora">
<div id="glow"></div>
<header>
  <div id="clock"></div>
  <nav id="tabs">
    <button class="f tab" data-view="home">Accueil</button>
    <button class="f tab" data-view="tv">Chaînes</button>
    <button class="f tab" data-view="settings">Réglages</button>
  </nav>
</header>

<main>
  <section id="home" class="view">
    <h2>Mes applications</h2>
    <div id="shelf" class="row"></div>
    <h2>Toutes les applications installées</h2>
    <div id="allapps" class="row wrap"></div>
  </section>

  <section id="tv" class="view" hidden>
    <input id="search" class="f" placeholder="Rechercher une chaîne…">
    <div id="channels" class="grid"></div>
  </section>

  <section id="settings" class="view" hidden>
    <h2>Thème</h2><div id="themes" class="row"></div>
    <h2>Halo lumineux</h2>
    <div class="row">
      <button class="f" id="glowMode"></button>
      <button class="f" id="glowInt"></button>
    </div>
    <h2>Playlist IPTV (M3U)</h2>
    <div class="row"><input id="m3u" class="f wide"><button class="f" id="m3uSave">Charger</button></div>
    <h2>Mises à jour</h2>
    <div class="row"><button class="f" id="upd">Rechercher</button><span id="updMsg"></span></div>
  </section>
</main>

<div id="player" hidden>
  <video id="video" autoplay playsinline></video>
  <div id="osd"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* Chargeur : prend css/js en ligne (GitHub Pages) -> sinon dernière copie en cache -> sinon fichiers embarqués */
(function () {
  var BASE = 'https://brolegacy.github.io/mytv/';
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem('mytv.boot.' + k); localStorage.setItem('mytv.boot.' + k, v); } catch (e) {} }
  function get(file) {
    var url = BASE + file + '?t=' + Math.floor(new Date().getTime() / 60000);
    var t = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 5000); });
    return Promise.race([fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }), t]);
  }
  function addCss(txt) { var s = document.createElement('style'); s.textContent = txt; document.head.appendChild(s); }
  function runJs(txt) { new Function(txt); var s = document.createElement('script'); s.textContent = txt; document.body.appendChild(s); }
  function local() { var s = document.createElement('script'); s.src = 'js/app.js'; document.body.appendChild(s); }
  if (typeof fetch !== 'function' || typeof Promise === 'undefined') return local();
  get('css/style.css').then(function (c) { addCss(c); ls('css', c); }).catch(function () { var c = ls('css'); if (c) addCss(c); });
  get('js/app.js').then(function (j) { new Function(j); runJs(j); ls('js', j); }).catch(function () {
    var j = ls('js');
    if (j) { try { runJs(j); return; } catch (e) { ls('js', ''); } }
    local();
  });
})();
</script>
</body>
</html>
