<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>MyTV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="aurora">
<div id="glow"></div>
<header>
  <div id="clock"></div>
  <div id="date"></div>
</header>

<main>
  <section id="home" class="view">
    <h2>Mes applications</h2>
    <div id="shelf" class="row"></div>
    <h2>Et aussi</h2>
    <div id="allapps" class="row"></div>
  </section>

  <section id="tv" class="view" hidden>
    <div class="bar">
      <input id="search" class="f" placeholder="Rechercher une chaîne…">
      <div id="count"></div>
    </div>
    <div id="channels" class="grid"></div>
  </section>

  <section id="settings" class="view" hidden>
    <div class="card c2"><h3>Thème</h3><div id="themes" class="row"></div></div>
    <div class="card"><h3>Halo lumineux</h3>
      <div class="row wrap"><button class="f pill" id="glowMode"></button><button class="f pill" id="glowInt"></button></div>
    </div>
    <div class="card"><h3>Playlist IPTV (M3U)</h3>
      <input id="m3u" class="f"><div class="row"><button class="f pill" id="m3uSave">Charger</button></div>
    </div>
    <div class="card"><h3>Mises à jour</h3>
      <div class="row"><button class="f pill" id="upd">Rechercher</button></div><span id="updMsg"></span>
    </div>
    <div class="card" id="remoteCard"><h3>Télécommande téléphone</h3></div>
  </section>
</main>

<nav id="tabs">
  <button class="f tab" data-view="home">Accueil<i></i></button>
  <button class="f tab" data-view="tv">Chaînes<i></i></button>
  <button class="f tab" data-view="settings">Réglages<i></i></button>
</nav>

<div id="player" hidden>
  <video id="video" autoplay playsinline></video>
  <div id="osd"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* Chargeur : prend css/js en ligne (GitHub Pages) -> sinon dernière copie en cache -> sinon fichiers embarqués */
(function () {
  var BASE = 'https://brolegacy.github.io/mytv/';
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem('mytv.boot.' + k); localStorage.setItem('mytv.boot.' + k, v); } catch (e) {} }
  function get(file) {
    var url = BASE + file + '?t=' + Math.floor(new Date().getTime() / 60000);
    var t = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 5000); });
    return Promise.race([fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }), t]);
  }
  function addCss(txt) { var s = document.createElement('style'); s.textContent = txt; document.head.appendChild(s); }
  function runJs(txt) { new Function(txt); var s = document.createElement('script'); s.textContent = txt; document.body.appendChild(s); }
  function local() { var s = document.createElement('script'); s.src = 'js/app.js'; document.body.appendChild(s); }
  if (typeof fetch !== 'function' || typeof Promise === 'undefined') return local();
  get('css/style.css').then(function (c) { addCss(c); ls('css', c); }).catch(function () { var c = ls('css'); if (c) addCss(c); });
  function tag(t) {
    var d = document.getElementById('bootTag');
    if (!d) { d = document.createElement('div'); d.id = 'bootTag'; d.style.cssText = 'position:fixed;right:12px;bottom:6px;z-index:99;font:18px sans-serif;color:#fff8;pointer-events:none'; document.body.appendChild(d); }
    d.textContent = 'v' + (window.MYTV_VERSION || '?') + ' · ' + t;
  }
  get('js/app.js').then(function (j) { new Function(j); runJs(j); ls('js', j); tag('en ligne'); }).catch(function (err) {
    var j = ls('js'), why = String(err && err.message || err);
    if (j) { try { runJs(j); tag('cache (' + why + ')'); return; } catch (e) { ls('js', ''); } }
    tag('embarqué (' + why + ')');
    local();
  });
})();
</script>
</body>
</html>
